[metadata]
name = "macports-outdated"
description = "Review and upgrade outdated MacPorts ports"
requirements = ["port"]

[source]
command = "port -q outdated | awk '{ print $1 }' | sort -u"

[preview]
command = "echo '--- Outdated port ---'; port outdated '{}' 2>&1; echo; echo '--- Port information ---'; port info '{}' 2>&1; echo; echo '--- Installed versions ---'; port installed '{}' 2>&1"

[keybindings]
enter = "actions:upgrade"
ctrl-u = "actions:selfupdate"
ctrl-a = "actions:upgrade-all"

[actions.selfupdate]
description = "Run port selfupdate; press Ctrl-R afterward to refresh the list"
command = "sudo port selfupdate"
mode = "fork"

[actions.upgrade]
description = "Upgrade the selected outdated port"
command = "sudo port upgrade '{}'"
mode = "execute"

[actions.upgrade-all]
description = "Upgrade all outdated ports"
command = "sudo port upgrade outdated"
mode = "execute"

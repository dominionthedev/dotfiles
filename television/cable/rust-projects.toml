[metadata]
name = "rust-projects"
description = "Rust projects containing Cargo.toml"

[source]
command = "fd --hidden --no-ignore --type f '^Cargo\\.toml$' ~/Developer --exclude .git | xargs -n1 dirname | sort -u"

[preview]
command = "bat --color=always --style=numbers '{}/Cargo.toml'"

[keybindings]
ctrl-e = "actions:edit"

[actions.cd]
description = "Enter project directory"
command = "cd '{}'"
mode = "execute"

[actions.edit]
description = "Open the repository in editor"
command = "${EDITOR:-vim} {}"
mode = "execute"

[actions.test]
description = "Run Rust tests"
command = "cd '{}' && cargo test"
mode = "execute"

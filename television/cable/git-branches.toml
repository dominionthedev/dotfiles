[metadata]
name = "git-branches"
description = "Local and remote git branches, for checkout"
requirements = ["git"]

[source]
command = "git branch -a --format='%(refname:short)' 2>/dev/null | sed 's#^origin/##' | sort -u"

[preview]
command = "git log --oneline --graph --color=always -n 50 '{}' 2>/dev/null"

[keybindings]
enter = "actions:checkout"

[actions.checkout]
description = "Checkout the selected branch"
command = "git checkout '{}'"
mode = "execute"

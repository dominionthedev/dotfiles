local:
  db_path: null
  blob_dir: null
  inline_images: auto
  image_optimization: off
  attachment_lifecycle:
    grace_days: 7
    quota_bytes: 10737418240
    preview_quota_bytes: 536870912
    maintenance_limit: 128
sync:
  enabled: false
  interval_seconds: 30
  qr_glyphs: auto
daemon:
  wake_addr: 127.0.0.1:47631
workspace:
  default: null
  routes: []
project:
  overrides:
    # aven-managed project path mapping
    - workspace_id: "0000000000000000"
      workspace: developer
      project: drop
      paths:
        - /Users/appleplay/Developer/projects/drop
    # aven-managed project path mapping
    - workspace_id: "0000000000000000"
      workspace: developer
      project: lean
      paths:
        - /Users/appleplay/Developer/projects/lean
agent:
  task_intake:
    command: null
    args:
      - -p
      - --no-session-persistence
      - --bare
      - "{prompt}"
    timeout_seconds: 45
    system_prompt: null
update:
  automatic_checks: true
tui:
  table:
    columns:
      - ref
      - title
      - labels
      - metadata
      - project
      - status
      - priority
      - time
    compact_status: false
  sidebar:
    views:
      - queue
      - ready
      - blocked
      - overdue
      - inbox
      - active
      - backlog
      - upcoming
      - done
      - epics
      - recent_actions
  columns:
    - name: Inbox
      statuses:
        - inbox
    - name: Backlog
      statuses:
        - backlog
    - name: Todo
      statuses:
        - todo
    - name: Active
      statuses:
        - active
    - name: Done
      statuses:
        - done
        - canceled
  commands: []

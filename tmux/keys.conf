# ── Root key table ──────────────────────────────────────────────────────────
bind-key -T root         S-Enter     send-keys Escape "[13;2u"
bind-key -T root         C-m         send-keys Escape "[109;5u"

bind r source-file -F '#{d:current_file}/../tmux.conf' \; display " Config reloaded"
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi C-v send -X rectangle-toggle

# Enter desk mode (disable ALL panes)
bind -n M-Space \
  set key-table desk \; \
  switch-client -T desk \; \
  run-shell 'for p in $(tmux list-panes -F "#{pane_id}"); do tmux select-pane -t $p -d; done'

# ── Desk key table ──────────────────────────────────────────────────────────
# Exit → root and re-enable ALL panes
bind -T desk i \
  set key-table root \; \
  switch-client -T root \; \
  run-shell 'for p in $(tmux list-panes -F "#{pane_id}"); do tmux select-pane -t $p -e; done'

bind -T desk Enter \
  set key-table root \; \
  switch-client -T root \; \
  run-shell 'for p in $(tmux list-panes -F "#{pane_id}"); do tmux select-pane -t $p -e; done'

# ── Focus ───────────────────────────────────────────────────────────────────
bind -T desk h     select-pane -L \; switch-client -T desk
bind -T desk j     select-pane -D \; switch-client -T desk
bind -T desk k     select-pane -U \; switch-client -T desk
bind -T desk l     select-pane -R \; switch-client -T desk
bind -T desk Left  select-pane -L \; switch-client -T desk
bind -T desk Down  select-pane -D \; switch-client -T desk
bind -T desk Up    select-pane -U \; switch-client -T desk
bind -T desk Right select-pane -R \; switch-client -T desk
bind -T desk \;    last-pane     \; switch-client -T desk

# ── Swap ────────────────────────────────────────────────────────────────────
bind -T desk H swap-pane -t '{left-of}'  \; switch-client -T desk
bind -T desk J swap-pane -t '{down-of}'  \; switch-client -T desk
bind -T desk K swap-pane -t '{up-of}'    \; switch-client -T desk
bind -T desk L swap-pane -t '{right-of}' \; switch-client -T desk

# ── Splits (always re-disable all panes afterwards) ─────────────────────────
# Smart split (horizontal if wide, vertical if tall)
bind -T desk n if -F '#{e|>:#{pane_width},#{e|*:#{pane_height},2}}' \
  'split-window -h -c "#{pane_current_path}"' \
  'split-window -v -c "#{pane_current_path}"' \; \
  select-layout -E \; \
  run-shell 'for p in $(tmux list-panes -F "#{pane_id}"); do tmux select-pane -t $p -d; done' \; \
  switch-client -T desk

# Explicit splits
bind -T desk | split-window -h -c "#{pane_current_path}" \; \
  run-shell 'for p in $(tmux list-panes -F "#{pane_id}"); do tmux select-pane -t $p -d; done' \; \
  switch-client -T desk

bind -T desk \\ split-window -h -c "#{pane_current_path}" \; \
  run-shell 'for p in $(tmux list-panes -F "#{pane_id}"); do tmux select-pane -t $p -d; done' \; \
  switch-client -T desk

bind -T desk - split-window -v -c "#{pane_current_path}" \; \
  run-shell 'for p in $(tmux list-panes -F "#{pane_id}"); do tmux select-pane -t $p -d; done' \; \
  switch-client -T desk

# ── Kill / Zoom / Equalize ──────────────────────────────────────────────────
bind -T desk x kill-pane \; switch-client -T desk
bind -T desk w kill-pane \; switch-client -T desk
bind -T desk z resize-pane -Z \; switch-client -T desk
bind -T desk = select-layout -E \; switch-client -T desk

# ── Resize (repeatable) ─────────────────────────────────────────────────────
bind -T desk -r '<' resize-pane -L 5 \; switch-client -T desk
bind -T desk -r '>' resize-pane -R 5 \; switch-client -T desk
bind -T desk -r '{' resize-pane -U 5 \; switch-client -T desk
bind -T desk -r '}' resize-pane -D 5 \; switch-client -T desk
bind -T desk -r C-h resize-pane -L 5 \; switch-client -T desk
bind -T desk -r C-j resize-pane -D 5 \; switch-client -T desk
bind -T desk -r C-k resize-pane -U 5 \; switch-client -T desk
bind -T desk -r C-l resize-pane -R 5 \; switch-client -T desk

# ── Layout cycling ──────────────────────────────────────────────────────────
bind -T desk t     next-layout \; switch-client -T desk
bind -T desk Space next-layout \; switch-client -T desk

# ── Pane selection by number ────────────────────────────────────────────────
bind -T desk 1 select-pane -t 1 \; switch-client -T desk
bind -T desk 2 select-pane -t 2 \; switch-client -T desk
bind -T desk 3 select-pane -t 3 \; switch-client -T desk
bind -T desk 4 select-pane -t 4 \; switch-client -T desk
bind -T desk 5 select-pane -t 5 \; switch-client -T desk
bind -T desk 6 select-pane -t 6 \; switch-client -T desk
bind -T desk 7 select-pane -t 7 \; switch-client -T desk
bind -T desk 8 select-pane -t 8 \; switch-client -T desk
bind -T desk 9 select-pane -t 9 \; switch-client -T desk

bind -T desk Tab  select-pane -t :.+ \; switch-client -T desk
bind -T desk BTab select-pane -t :.- \; switch-client -T desk

# ── Windows ─────────────────────────────────────────────────────────────────
bind -T desk C-c new-window -c "#{pane_current_path}" \; \
  run-shell 'for p in $(tmux list-panes -F "#{pane_id}"); do tmux select-pane -t $p -d; done' \; \
  switch-client -T desk

bind -T desk C-n next-window     \; switch-client -T desk
bind -T desk C-p previous-window \; switch-client -T desk

bind -T desk M-1 select-window -t 1 \; switch-client -T desk
bind -T desk M-2 select-window -t 2 \; switch-client -T desk
bind -T desk M-3 select-window -t 3 \; switch-client -T desk
bind -T desk M-4 select-window -t 4 \; switch-client -T desk
bind -T desk M-5 select-window -t 5 \; switch-client -T desk
bind -T desk M-6 select-window -t 6 \; switch-client -T desk
bind -T desk M-7 select-window -t 7 \; switch-client -T desk
bind -T desk M-8 select-window -t 8 \; switch-client -T desk
bind -T desk M-9 select-window -t 9 \; switch-client -T desk

# ── Break / Join / Rename / Sync ────────────────────────────────────────────
bind -T desk ! break-pane \; switch-client -T desk
bind -T desk @ choose-window 'join-pane -s "%%"' \; switch-client -T desk
bind -T desk r command-prompt -I "#W" "rename-window '%%'" \; switch-client -T desk
bind -T desk a setw synchronize-panes \; switch-client -T desk

# ── Help & visual aids ──────────────────────────────────────────────────────
bind -T desk ? display-message "desk │ hjkl focus │ HJKL swap │ n smart-split │ |/- split │ x/w kill │ z zoom │ = eq │ t layout │ 1-9 pane │ M-1-9 win │ i/Enter exit"
bind -T desk Q display-panes -d 800 \; switch-client -T desk

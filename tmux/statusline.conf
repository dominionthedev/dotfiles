# statusline.conf — olimorris-style bar, Catppuccin palette, your modes.
# WHERE: source it right where your status-left/status-right lines live now:
#        AFTER `run catppuccin.tmux` (needs @thm_* colours), BEFORE `run tpm`
#        (so tmux-battery / primary-ip / pomodoro can fill their #{placeholders}).
# RULES: runtime state (prefix, zoom, copy-mode) => plain `set -g`.
#        Plugin option strings (no runtime state) => `set -gF` so #{@thm_*} become hex at load time,
#        because plugin scripts print those strings and tmux does not re-expand their output.

# ── pill: PREFIX > DESK > TMUX > SYNC > session name ─────────────────────────────────
# NOTE: #{client_prefix} is true for ANY non-default key table (desk included), so compare the table name.
%hidden MODE_BG="#{?#{==:#{client_key_table},prefix},#{@thm_sapphire},#{?#{==:#{client_key_table},desk},#{@thm_peach},#{?pane_in_mode,#{@thm_green},#{?pane_synchronized,#{@thm_red},#{@thm_mauve}}}}}"
%hidden MODE_TXT="#{?#{==:#{client_key_table},prefix},PREFIX,#{?#{==:#{client_key_table},desk},DESK,#{?pane_in_mode,TMUX,#{?pane_synchronized,SYNC,#S}}}}"
# pane/window state icons — add a state later by appending one #{?flag, <icon>,} term
%hidden PANE_ICONS="#{?window_zoomed_flag, \uf065,}#{?pane_input_off, \uf023,}#{?pane_marked, \uf02e,}"
%hidden SEP="#[fg=#{@thm_surface_2}]│"

# ── bar ───────────────────────────────────────────────────────────────────────────────
set -g status-style "bg=#{@thm_surface_0},fg=#{@thm_overlay_1}"
set -g status-position top
set -g status-interval 1
set -g status-justify centre
set -g status-left-length 90
set -g status-right-length 140

# ── left: [pill]◤ pane icons time │ pomodoro ──────────────────────────────────────────
set -g status-left "#[bg=${MODE_BG}]#[fg=#{@thm_crust}]#[bold] ${MODE_TXT} #[nobold]#[fg=${MODE_BG}]#[bg=#{@thm_surface_0}]\ue0b8#[fg=#{@thm_overlay_1}]${PANE_ICONS} #[fg=#{@thm_subtext_0}] %H:%M #{pomodoro_status}"

# ── middle: windows ("1: shell"; italic number; current = mauve number + bold name) ───
set -g window-status-separator "   "
set -g window-status-style default
set -g window-status-current-style default
set -g window-status-format "#[fg=#{@thm_overlay_0}]#[italics]#I: #[noitalics]#W"
set -g window-status-current-format "#[fg=#{@thm_mauve}]#[italics]#I: #[fg=#{@thm_subtext_1}]#[noitalics]#[bold]#W#[nobold]"

# ── right: battery  uptime │ temp │ ip  ───────────────────────────────────────────────
set -g status-right "#[fg=#{@thm_subtext_0}]#{battery_icon} #{battery_percentage} #[fg=#{@thm_overlay_0}]#(~/.config/tmux/scripts/uptime.sh) ${SEP} #(~/.config/tmux/scripts/temp.sh) ${SEP} #[fg=#{@thm_maroon}]#{primary_ip_icon} #{primary_ip}  "

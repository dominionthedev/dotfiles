# ── Pane and Windows (root table) ───────────────────────────────────────────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind a setw synchronize-panes
bind c new-window -c "#{pane_current_path}"
bind x confirm-before -p "Kill pane? (y/N) ❯" kill-pane
bind Enter last-window

bind g new-pane -c "#{pane_current_path}" -x 90% -y 90% -S "fg=#cba6f7" "lazygit"
bind n new-pane -c "#{pane_current_path}" -x 75% -y 75% -S "fg=#a6e3a1" "$SHELL"
bind e new-pane -c "#{pane_current_path}" -x 75% -y 75% -S "fg=#89b4fa" "yazi"
bind f run-shell "~/.config/tmux/scripts/tv-menu.sh"

set -g pane-border-status top
set -g pane-border-format ' #[fg=#f38ba8]● #[fg=#f9e2af]● #[fg=#a6e3a1]● '

# ── Tmux Settings ───────────────────────────────────────────────────────────
set -g default-terminal "xterm-256color"
set -as terminal-features ",*:RGB"
set -g allow-passthrough on
set -g mouse on
set -g cursor-style blinking-bar
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 10
set -g focus-events on
setw -g aggressive-resize on
# set -g extended-keys on

# ── Keys ────────────────────────────────────────────────────────────────────
bind-key -T root         S-Enter     send-keys Escape "[13;2u"
bind-key -T root         C-m         send-keys Escape "[109;5u"
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix
bind r source-file ~/.config/tmux/tmux.conf \; display " Config reloaded"
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi C-v send -X rectangle-toggle

# ── Pane and Windows ────────────────────────────────────────────────────────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind a setw synchronize-panes
bind c new-window -c "#{pane_current_path}"
bind x confirm-before -p "Kill pane? (y/N) ❯" kill-pane
bind Enter last-window
bind g display-popup -d "#{pane_current_path}" -w 90% -h 90% -b rounded -S "fg=#cba6f7" -E "lazygit"
bind f display-popup -d "#{pane_current_path}" -w 75% -h 75% -b rounded -S "fg=#a6e3a1" -E "$SHELL"

# ── Plugins & settings ──────────────────────────────────────────────────────
set-environment -gF TMUX_PLUGIN_MANAGER_PATH '#{HOME}/.local/share/tmux/plugins/'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'joshmedeski/tmux-nerd-font-window-name'
set -g @plugin 'dreknix/tmux-primary-ip'
set -g @catppuccin_window_text "#W"
set -g @catppuccin_window_current_text "#W"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_number_position 'right'
set -g @catppuccin_battery_color "#{@thm_blue}"
set -g @catppuccin_date_time_color "#{@thm_sapphire}"
set -g @catppuccin_date_time_text " %a %H:%M"

run '#{TMUX_PLUGIN_MANAGER_PATH}/tmux/catppuccin.tmux'
source -F '#{d:current_file}/custom/network.conf'

# ── Status bar ───────────────────────────────────────────────────────────────
set -g status-interval 2
setw -g window-status-separator ""
set -g status-right-length 100
set -g status-left-length 150
set -g status-left '#{E:@catppuccin_status_session}'
set -gF status-right '#{E:@catppuccin_status_battery}'
set -ag status-right '#(~/.config/tmux/custom/temp.sh)'
set -agF status-right '#{E:@catppuccin_status_date_time}#{E:@catppuccin_status_network}#{E:@catppuccin_status_host}'

run '~/.local/share/tmux/plugins/tpm/tpm'

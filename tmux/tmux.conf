# ── Tmux Settings ───────────────────────────────────────────────────────────
set -g default-terminal "xterm-256color"
set -as terminal-features ",*:RGB"
set -g allow-passthrough on
set -g mouse on
set -g cursor-style blinking-bar
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 10
set -g focus-events on
setw -g aggressive-resize on
set -g lock-after-time 300
set -g lock-command "unimatrix -s 95"

# ── Prefix key ──────────────────────────────────────────────────────────────
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# ── Controls ────────────────────────────────────────────────────────────────
bind -n MouseDown1StatusRight run-shell "~/.config/tmux/scripts/controls-menu.sh"

# ── Plugins & settings ──────────────────────────────────────────────────────
set-environment -gF TMUX_PLUGIN_MANAGER_PATH '#{HOME}/.local/share/tmux/plugins'

set -g @fzf-url-fzf-options '-p 60%,30% --prompt="  " --border-label=" Open URL "'
set -g @fzf-url-history-limit '2000'
set -g @batt_icon_charge_tier8 "󰁹"
set -g @batt_icon_charge_tier7 "󰂁"
set -g @batt_icon_charge_tier6 "󰁿"
set -g @batt_icon_charge_tier5 "󰁾"
set -g @batt_icon_charge_tier4 "󰁽"
set -g @batt_icon_charge_tier3 "󰁼"
set -g @batt_icon_charge_tier2 "󰁻"
set -g @batt_icon_charge_tier1 "󰁺"
set -g @batt_icon_status_charged "󰚥"
set -g @batt_icon_status_charging "󰂄"
set -g @batt_icon_status_discharging "󰂃"
set -g @batt_icon_status_unknown "󰂑"
set -g @batt_icon_status_attached "󱈑"
set -gF @pomodoro_on       "${SEP} #[fg=#{@thm_red}]● "
set -gF @pomodoro_complete "${SEP} #[fg=#{@thm_green}]● "
set -gF @pomodoro_pause    "${SEP} #[fg=#{@thm_yellow}]● "
set -gF @pomodoro_prompt_break    "${SEP} #[fg=#{@thm_green}]? "
set -gF @pomodoro_prompt_pomodoro "${SEP} #[fg=#{@thm_red}]? "
set -g @pomodoro_granularity 'on'
set -g @pomodoro_repeat 'off'
set -g @pomodoro_notifications 'on'
set -g @pomodoro_sound 'Blow'

set -g @plugin 'tmux-plugins/tpm'
#set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'dreknix/tmux-primary-ip'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'olimorris/tmux-pomodoro-plus'

run '#{TMUX_PLUGIN_MANAGER_PATH}/tmux/catppuccin.tmux'

# ── Source modules ─────────────────────────────────────────────────────────────
source -F '#{d:current_file}/statusline.conf'
source -F '#{d:current_file}/keys.conf'
source -F '#{d:current_file}/panes.conf'

run '#{TMUX_PLUGIN_MANAGER_PATH}/tpm/tpm'

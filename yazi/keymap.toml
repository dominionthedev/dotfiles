[mgr]
prepend_keymap = [
  # ── Navigation ──────────────────────────────────────────────
  { on = [
    "g",
    "n",
  ], run = "cd ~/Developer/notes", desc = "Go to notes" },
  { on = [
    "g",
    "v",
  ], run = "cd ~/Developer/vault", desc = "Go to vault" },
  { on = [
    "g",
    "V",
  ], run = "cd /Volumes/vault", desc = "Go to external vault" },

  { on = [
    "g",
    "l",
  ], run = "cd ~/Developer/leraniode", desc = "Go to Leraniode" },
  { on = [
    "g",
    "p",
  ], run = "cd ~/Developer/projects", desc = "Go to projects" },

  # ── Common locations ────────────────────────────────────────
  { on = [
    "g",
    "d",
  ], run = "cd ~/Developer", desc = "Go to Developer" },
  { on = [
    "g",
    "h",
  ], run = "cd ~", desc = "Go to home" },
  { on = [
    "g",
    "D",
  ], run = "cd ~/Downloads", desc = "Go to Downloads" },
  { on = [
    "g",
    "i",
  ], run = "cd '~/Library/Mobile Documents/com~apple~CloudDocs'", desc = "Go to iCloud Drive" },

  # ── Plugins ─────────────────────────────────────────────────
  { on = "l", run = "plugin smart-enter", desc = "Enter dir, or open file" },
  { on = "M", run = "plugin mount", desc = "Mount / unmount / eject volumes (verify args)" },
  { on = "!", run = 'shell "$SHELL" --block', desc = "Open $SHELL here", for = "unix" },
  { on = "C", run = "plugin ouch compress", desc = "Compress selection (via ouch)" },
  { on = "U", run = "plugin ouch decompress", desc = "Decompress selection (via ouch)" },
  { on = "T", run = "plugin empty-trash", desc = "Empty the trash (via `trash -ey`)" },
  { on = "p", run = "plugin smart-paste", desc = "Paste into hovered directory or CWD" },
  { on = [
    "c",
    "m",
  ], run = "plugin chmod", desc = "Chmod selected files" },
  { on = [
    "m",
    "f",
  ], run = "plugin diff", desc = "Diff selected with hovered file" },
  { on = [
    "m",
    "m",
  ], run = "plugin toggle-pane max-current", desc = "Maximize current pane" },
  { on = [
    "m",
    "p",
  ], run = "plugin toggle-pane max-preview", desc = "Max preview pane" },
]

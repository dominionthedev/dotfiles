[mgr]
prepend_keymap = [
  # ── Navigation ──────────────────────────────────────────────
  { on = [
    "g",
    "n",
  ], run = "cd ~/Developer/notes", desc = "Go to notes" },
  { on = [
    "g",
    "v",
  ], run = "cd ~/Developer/vault", desc = "Go to vault" },
  { on = [
    "g",
    "V",
  ], run = "cd /Volumes/vault", desc = "Go to external vault" },

  { on = [
    "g",
    "l",
  ], run = "cd ~/Developer/leraniode", desc = "Go to Leraniode" },
  { on = [
    "g",
    "p",
  ], run = "cd ~/Developer/projects", desc = "Go to projects" },

  # ── Common locations ────────────────────────────────────────
  { on = [
    "g",
    "d",
  ], run = "cd ~/Developer", desc = "Go to Developer" },
  { on = [
    "g",
    "h",
  ], run = "cd ~", desc = "Go to home" },
  { on = [
    "g",
    "D",
  ], run = "cd ~/Downloads", desc = "Go to Downloads" },
  { on = [
    "g",
    "i",
  ], run = "cd '~/Library/Mobile Documents/com~apple~CloudDocs'", desc = "Go to iCloud Drive" },

  # ── File operations ─────────────────────────────────────────
  { on = [
    "m",
  ], run = "yank --cut", desc = "Move selected files" },

  # ── Plugins ─────────────────────────────────────────────────
  # ya pkg add yazi-rs/plugins:smart-enter (setup already default, README-verified)
  { on = "l", run = "plugin smart-enter", desc = "Enter dir, or open file" },
  # ya pkg add yazi-rs/plugins:mount
  { on = "M", run = "plugin mount", desc = "Mount / unmount / eject volumes (verify args)" },
  { on = "!", run = 'shell "$SHELL" --block', desc = "Open $SHELL here", for = "unix" },
]
